services:
  - type: web
    name: canvas-todo-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm run start
    envVars:
      - key: CANVAS_API_KEY
        sync: false
      - key: CANVAS_BASE_URL
        value: https://canvas.instructure.com/api/v1
